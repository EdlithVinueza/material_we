<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo práctico-experimental. Diseño de interacción móvil, gestión de estados y navegación gestual</title><desc id="descripcion">Crea rutas y pestañas → Mantén el estado al cambiar pantalla → Verifica la interacción. Evidencia: Navegación y registro de pruebas. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#235c83" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e6f0f8"/><circle cx="114" cy="86" r="23" fill="#235c83"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:rect x="48" y="22" width="108" height="160" rx="22" fill="#1c3747" /><ns0:rect x="55" y="33" width="94" height="137" rx="17" fill="#ffffff" /><ns0:rect x="83" y="28" width="37" height="8" rx="4" fill="#1c3747" /><ns0:rect x="68" y="48" width="69" height="51" rx="9" fill="#fbebdc" /><ns0:g transform="translate(82.0 52.0) scale(0.42)"><ns0:path d="M31 12h38a5 5 0 0 1 5 5v66a5 5 0 0 1-5 5H31a5 5 0 0 1-5-5V17a5 5 0 0 1 5-5z M26 70h48 M45 80h10 M36 27h27 M36 37h27 M36 47h17" fill="none" stroke="#70493b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:rect x="68" y="112" width="56" height="6" rx="3" fill="#70493b" /><ns0:rect x="68" y="127" width="62" height="6" rx="3" fill="#fbebdc" /><ns0:rect x="68" y="143" width="44" height="6" rx="3" fill="#fbebdc" /></ns0