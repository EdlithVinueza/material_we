<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Infografía. Integración de servicios web, persistencia local y servicios inteligentes</title><desc id="descripcion">Persistencia local. Guarda preferencias simples como clave y valor; usa almacenamiento estructurado para consultas y relaciones.. Servicios inteligentes. Un servicio de voz o visión necesita permisos explícitos y una salida comprensible si falla.</desc><path d="M34 307Q8 117 231 98q181-23 353 41 197-70 369-27 194 45 213 172 38 177-139 233-182 47-404-19-238 91-428 9Q45 451 34 307Z" fill="#fbebdc" stroke="#fbebdc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="316" cy="239" rx="118" ry="109" fill="#ffffff"/><g transform="translate(228.0 151.0) scale(0.88)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#fbebdc" stroke="#70493b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M19 21h24v-2a7 7 0 0 1 14 0v2h24v24h-4a7 7 0 0 0 0 14h4v22H56v-5a7 7 0 0 0-14 0v5H19V57h5a7 7 0 0 0 0-14h-5z" fill="none" stroke="#70493b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#64a995" stroke="#64a995" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="316" y="383" fill="#70493b" font-size="31" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Persistencia local</text><text x="316" y="430" fill="#364e5a" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Guarda preferencias simples como</text><text x="316" y="461" fill="#364e5a" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">clave y valor; usa almacenamiento</text><text x="316" y="492"