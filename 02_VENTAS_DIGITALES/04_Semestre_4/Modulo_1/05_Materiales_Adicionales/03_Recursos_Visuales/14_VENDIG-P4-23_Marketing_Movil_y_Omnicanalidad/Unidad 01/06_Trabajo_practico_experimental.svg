<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo practico experimental. Ecosistema y comunicación comercial móvil</title><desc id="descripcion">Desarrollo en dos fases sobre el negocio ficticio de referencia: en la semana 1, auditoría técnica de adaptabilidad móvil y velocidad de carga de un sitio comercial; en la semana 2, configuración de un catálogo móvil de productos con enlaces de compra directa, perfil comercial, respuestas rápidas y etiquetas en WhatsApp Business (o maqueta verificable), entregando un único expediente en Moodle al cierre de la semana 2 según la Práctica 1 de la Guía de Prácticas. Resumen visual: Audita adaptación y carga móvil; Configura catálogo, respuestas y etiquetas; Verifica enlaces de compra en el caso. Evidencia: Auditoría y catálogo o maqueta comprobable.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#235c83" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e6f0f8"/><circle cx="114" cy="86" r="23" fill="#235c83"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747" /><ns0:rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff" /><ns0:rect x="24" y="43" width="152" height="15" rx="9" fill="#e1f0f3" /><ns0:circle cx="33" cy="50" r="2" fill="#1d6c78" /><ns0:circle cx="41" cy="50" r="2" f