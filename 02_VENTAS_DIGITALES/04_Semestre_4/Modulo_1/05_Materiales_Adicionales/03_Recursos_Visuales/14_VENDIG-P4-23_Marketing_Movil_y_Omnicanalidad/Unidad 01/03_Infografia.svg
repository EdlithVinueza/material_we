<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Un catálogo móvil que facilita el pedido</title><desc id="descripcion">Producto. Incluye una imagen legible y un identificador. Condiciones. Muestra precio, disponibilidad y fecha de actualización. Continuidad. Conserva el identificador al abrir una consulta. El cliente debe poder preguntar sin volver a explicar qué vio.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#e1f0f3" stroke="#e1f0f3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="245" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 162.5) scale(0.825)"><rect x="48" y="22" width="108" height="160" rx="22" fill="#1c3747"/><rect x="55" y="33" width="94" height="137" rx="17" fill="#ffffff"/><rect x="83" y="28" width="37" height="8" rx="4" fill="#1c3747"/><rect x="68" y="48" width="69" height="51" rx="9" fill="#e1f0f3"/><g transform="translate(82.0 52.0) scale(0.42)"><path d="M14 20h72v60H14z M14 32h72 M43 43l16 10-16 10z M22 26h4 M30 26h4" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="68" y="112" width="56" height="6" rx="3" fill="#1d6c78"/><rect x="68" y="127" width="62" height="6" rx="3" fill="#e1f0f3"/><rect x="68" y="143" width="44" height="6" rx="3" fill="#e1f0f3"/></g><text x="220" y="389" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Producto</text><text x="220" y="429" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Incluye una imagen</text><text x="220" y="460" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">legible y un</text><text x="220" y="491" fill="#364e5a" font-size="