<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Personaliza una oferta con datos pertinentes</title><desc id="descripcion">Cobertura. Confirma que el negocio atienda la zona. Interés. Usa una preferencia o señal justificable. Control. Comprueba horario, condición de baja y derivación. La pertinencia de la oferta y el permiso para contactar se comprueban.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#e1f0f3" stroke="#e1f0f3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="245" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 162.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e1f0f3" stroke="#1d6c78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M69 34c0 14-19 35-19 35S31 48 31 34a19 19 0 1 1 38 0z M55 34a5 5 0 1 1-10 0 5 5 0 0 1 10 0z M27 52l-9 24h64l-9-24" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#db9875" stroke="#db9875" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220" y="389" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Cobertura</text><text x="220" y="429" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Confirma que el</text><text x="220" y="460" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">negocio atienda la</text><text x="220" y="491" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">zona.</text><ellipse cx="600" cy="298" rx="115" ry="103" fill="#fbeadb"/><g transform="translate(517.5 215.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e1f0f3" stroke="#1d6c78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M79 39a34 34 0 1 1-20-20 M66 43a18 18 0 1 1-9-10 M49 51l35-35 M72 15h13v13" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#db9875" stroke="#db9875" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="600" y="442" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Interés</text><text x="600" y="482" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Usa una preferencia o</text><text x="600" y="513" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">señal justificable.</text><ellipse cx="980" cy="245" rx="115" ry="103" fill="#ffffff"/><g transform="translate(897.5 162.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e1f0f3" stroke="#1d6c78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M50 14l30 12v22c0 17-14 29-30 38-16-9-30-21-30-38V26z M37 48l9 9 18-19" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#db9875" stroke="#db9875" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="980" y="389" fill="#172d40" font-size="32" font-family=