<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Cuándo tiene sentido una notificación</title><desc id="descripcion">Preferencia. La persona solicitó un aviso de disponibilidad. Evento. El negocio confirma que hay existencias. Envío. Aplica horario, frecuencia y regla de salida. Un aviso debe ser pertinente cuando se ejecuta.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#e1f0f3" stroke="#e1f0f3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="297" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 214.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e1f0f3" stroke="#1d6c78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M65 31a15 15 0 1 1-30 0 15 15 0 0 1 30 0z M20 82v-8c0-16 14-25 30-25s30 9 30 25v8z" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#db9875" stroke="#db9875" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220" y="441" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Preferencia</text><text x="220" y="481" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">La persona solicitó un</text><text x="220" y="512" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">aviso de disponibilidad.</text><ellipse cx="600" cy="239" rx="115" ry="103" fill="#fbeadb"/><g transform="translate(517.5 156.5) scale(0.825)"><path d="M29 79L10