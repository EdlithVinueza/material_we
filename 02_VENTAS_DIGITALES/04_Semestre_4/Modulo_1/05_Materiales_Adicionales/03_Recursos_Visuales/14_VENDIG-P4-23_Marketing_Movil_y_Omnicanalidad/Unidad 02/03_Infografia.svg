<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Tres métricas para una campaña móvil</title><desc id="descripcion">CTR. 60 clics de 1 200 impresiones = 5 %. Costo por chat. USD 40 de pauta ÷ 20 chats = USD 2. Compra desde chat. 5 compras de 20 chats = 25 %. Cada métrica explica una etapa distinta.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#e1f0f3" stroke="#e1f0f3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="245" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 162.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e1f0f3" stroke="#1d6c78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M36 22l6 57 13-16 14 20 8-6-15-19 21-3z M15 29h11 M24 13l6 9 M48 12l-3 10 M14 48l10-5" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#db9875" stroke="#db9875" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220" y="389" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">CTR</text><text x="220" y="429" fill="#1d6c78" font-size="25" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">CTR: 60 ÷ 1 200 = 5 %</text><ellipse cx="600" cy="298" rx="115" ry="103" fill="#fbeadb"/><g transform="translate(517.5 215.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e1f0f3" stroke="#1d6c78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M14 24h69v47H47L28 84V71H14z M29 39h39 M29 52h26" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#db9875" stroke="#db9875" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="600" y="442" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Costo por chat</text><text x="600" y="482" fill="#1d6c78" font-size="27" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">USD 40 ÷ 20 = USD 2</text><ellipse cx="980" cy="245" rx="115" ry="103" fill="#ffffff"/><g transform="translate(897.5 162.5) scale(0.825)"><path d="M29 79L100 49l71 30-71 34z" fill="#fbeadb" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M29 79v65l71 32v-63z" fill="#e1f0f3" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M171 79v65l-71 32v-63z" fill="#db9875" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M67 64l70 34v29" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(42.5 98.5) scale(0.45)"><path d="M12 19h13l12 41h39l12-27H30 M39 75a5 5 0 1 0 0 10 5 5 0 1 0 0-10 M72 75a5 5 0 1 0 0 10 5 5 0 1 0 0-10 M49 44h19" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="980" y="389" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Compra desde</text><text x="980" y="425" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">chat</text><text x="980" y="462" fill="#1d6c78" font-size="27" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">5 ÷ 20 = 25 %</text><path d="M90 206q3 8 1