<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo autonomo. Diseño y medición de campañas móviles</title><desc id="descripcion">En la semana 3, lectura de Gomez Albrecht y colaboradores (2023, capítulo 16, sección 16.2) y Ordoñez Iturralde (2024, capítulo 2, apartados sobre estrategia, segmentación, selección de público objetivo y posicionamiento con inteligencia artificial) para analizar la planificación de una campaña interactiva móvil; en la semana 4, elaboración del reporte de rendimiento de la campaña comercial móvil a partir de Gomez Albrecht y colaboradores (2023, capítulo 16, sección 16.3), integrando la **comprobación conceptual de planificación y métricas** (que completa el componente de examen parcial del primer bimestre junto con la Unidad 1, sin examen separado) en un único documento en Moodle al cierre de la semana 4. Resumen visual: Analiza segmentación y diseño de campaña; Redacta el reporte de rendimiento; Integra la comprobación de métricas. Evidencia: Reporte y comprobación en un solo documento.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#21685e" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e5f2ed"/><circle cx="114" cy="86" r="23" fill="#21685e"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:path d="M64 22h77l28 25v131H64Z" fill="#e1f0f3" stroke="#1d6c78" strok