<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Datos que conectan compra y retiro</title><desc id="descripcion">Compra. Registra el mismo identificador de pedido en la tienda web. Retiro. Marca confirmación, preparación y entrega en el punto físico. Medición. Calcula el tiempo del tramo donde se forma la espera. Un identificador común evita contar el mismo pedido dos veces.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#e1f0f3" stroke="#e1f0f3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="245" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 162.5) scale(0.825)"><path d="M29 79L100 49l71 30-71 34z" fill="#fbeadb" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M29 79v65l71 32v-63z" fill="#e1f0f3" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M171 79v65l-71 32v-63z" fill="#db9875" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M67 64l70 34v29" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(42.5 98.5) scale(0.45)"><path d="M12 19h13l12 41h39l12-27H30 M39 75a5 5 0 1 0 0 10 5 5 0 1 0 0-10 M72 75a5 5 0 1 0 0 10 5 5 0 1 0 0-10 M49 44h19" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="220" y="389" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Compra</text><text x="220" y="429" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Registra el mismo</text><text x="220" y="460" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">identificador de pedido</text><text x="220" y="491" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">en la tienda web.</text><ellipse cx="600" cy="298" rx="115" ry="103" fill="#fbeadb"/><g transform="translate(517.5 215.5) scale(0.825)"><rect x="35" y="66" width="132" height="106" rx="7" fill="#ffffff" stroke="#1c3747" stroke-width="2"/><rect x="58" y="102" width="45" height="53" rx="3" fill="#e1f0f3" stroke="#1d6c78" stroke-width="2"/><rect x="116" y="102" width="31" height="70" rx="3" fill="#fbeadb" stroke="#1c3747" stroke-width="2"/><path d="M27 70l22-39h105l22 39v14H27Z" fill="#db9875" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 34l-12 36v12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M86 34l-4 36v12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 34l4 36v12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M142 34l12 36v12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(59.0 108.0) scale(0.4)"><path d="M18 40l7-20h50l7 20 M18 40h64v8a8 8 0 0 1-16 0 8 8 0 0 1-16 0 8 8 0 0 1-16 0 8 8 0 0 1-16 0z M24 55v27h52V55 M42 82V64h16v18" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="600" y="442" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Retiro</text><text x="600" y="482" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Marca confirmación,</text><text x="600" y="513" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">preparación y entrega</text><text x="600" y="544" fill="#364e5a" font-size="27" font-fam