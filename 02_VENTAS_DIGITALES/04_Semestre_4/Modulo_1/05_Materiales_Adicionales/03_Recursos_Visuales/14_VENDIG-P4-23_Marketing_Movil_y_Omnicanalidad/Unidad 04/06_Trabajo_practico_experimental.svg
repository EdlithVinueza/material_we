<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo practico experimental. Integración omnicanal y optimización de la experiencia</title><desc id="descripcion">En la semana 7, diseño del mapa de viaje del cliente omnicanal identificando puntos de fricción entre tienda virtual, redes y punto físico, integrando comprobantes digitales y códigos de respuesta rápida (QR) sin papel; en la semana 8, consolidación de la estrategia integral, análisis en hoja de cálculo de las métricas simuladas de fricción, conversión, retención, valor de vida del cliente (CLV), ROAS y CPA, y justificación de mejoras prioritarias en un único expediente al cierre de la semana 8 según la Práctica 4 de la Guía de Prácticas. Resumen visual: Mapea fricciones e integra comprobante y QR; Analiza conversión, retención, CLV, ROAS y CPA; Justifica mejoras de la experiencia. Evidencia: Mapa, hoja de métricas y estrategia integrada.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#235c83" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e6f0f8"/><circle cx="114" cy="86" r="23" fill="#235c83"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e1f0f3" stroke="#1d6c78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:ellipse cx="10