width="4" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M142 34l12 36v12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ns0:g transform="translate(59.0 108.0) scale(0.4)"><ns0:path d="M18 40l7-20h50l7 20 M18 40h64v8a8 8 0 0 1-16 0 8 8 0 0 1-16 0 8 8 0 0 1-16 0 8 8 0 0 1-16 0z M24 55v27h52V55 M42 82V64h16v18" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g></ns0:g><text x="600" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Analiza conversión,</text><text x="600" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">retención, CLV,</text><text x="600" y="364" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">ROAS y CPA</text><circle cx="1010" cy="165" r="92" fill="#e6f0f8"/><circle cx="934" cy="86" r="23" fill="#235c83"/><text x="934" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(936 91) scale(0.74)"><ns0:rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747" /><ns0:rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff" /><ns0:rect x="24" y="43" width="152" height="15" rx="9" fill="#e1f0f3" /><ns0:circle cx="33" cy="50" r="2" fill="#1d6c78" /><ns0:circle cx="41" cy="50" r="2" fill="#1d6c78" /><ns0:circle cx="49" cy="50" r="2" fill="#1d6c78" /><ns0:rect x="35" y="67" width="93" height="64" rx="7" fill="#e1f0f3" /><ns0:g transform="translate(51.5 69.5) scale(0.59)"><ns0:path d="M12 21h76v57H12z M12 34h76 M20 27h2 M27 27h2 M34 27h2 M24 45h22v21H24z M54 48h23 M54 59h17" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:rect x="138" y="71" width="23" height="8" rx="4" fill="#db9875" /><ns0:rect x=