<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo practico experimental. Diagnóstico y formulación del proyecto aplicado</title><desc id="descripcion">Taller aplicado en dos fases sobre su emprendimiento o pyme seleccionado: en la semana 1, diagnóstico situacional comercial (árbol de problemas, análisis FODA y redacción de problema, justificación, beneficiarios y objetivos); en la semana 2, elaboración del marco referencial, análisis comparativo de competidores y propuesta preliminar de intervención digital, entregando un único expediente al cierre de la semana 2 según la Práctica 1 de la Guía de Prácticas. Resumen visual: Construye árbol del problema y FODA; Delimita objetivos y beneficiarios; Compara referentes y propone intervención. Evidencia: Perfil de proyecto y marco referencial.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#235c83" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e6f0f8"/><circle cx="114" cy="86" r="23" fill="#235c83"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:rect x="35" y="66" width="132" height="106" rx="7" fill="#ffffff" stroke="#1c3747" stroke-width="2" /><ns0:rect x="58" y="102" width="45" height="53" rx="3" fill="#fbebdc" stroke="#70493b" stroke-width="2" /><ns0:rect x="116" y="102" width="31" height="70" rx="3" fill="#dff0e9" stroke="#1c3747" stroke