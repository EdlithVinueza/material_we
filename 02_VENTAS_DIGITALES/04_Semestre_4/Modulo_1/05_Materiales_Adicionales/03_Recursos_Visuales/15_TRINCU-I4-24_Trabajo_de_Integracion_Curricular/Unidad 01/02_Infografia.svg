<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Elige un proyecto que puedas investigar</title><desc id="descripcion">Negocio. Identifica un emprendimiento o pyme con acceso acordado. Problema. Delimita producto, canal, periodo y evidencia disponible. Beneficiarios. Indica a quién afecta y quién podrá usar la mejora. Viabilidad y alcance se comprueban antes de proponer una solución.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#fbebdc" stroke="#fbebdc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="297" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 214.5) scale(0.825)"><rect x="35" y="66" width="132" height="106" rx="7" fill="#ffffff" stroke="#1c3747" stroke-width="2"/><rect x="58" y="102" width="45" height="53" rx="3" fill="#fbebdc" stroke="#70493b" stroke-width="2"/><rect x="116" y="102" width="31" height="70" rx="3" fill="#dff0e9" stroke="#1c3747" stroke-width="2"/><path d="M27 70l22-39h105l22 39v14H27Z" fill="#64a995" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 34l-12 36v12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M86 34l-4 36v12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 34l4 36v12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M142 34l12 36v12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(59.0 108.0) scale(0.4)"><path d="M18 40l7-20h50l7 20 M18 40h64v8a8 8 0 0 1-16 0 8 8 0 0 1-16 0 8 8 0 0 1-16 0 8 8 0 0 1-16 0z M24 55v27h52V55 M42 82V64h16v18" fill="none" stroke="#70493b