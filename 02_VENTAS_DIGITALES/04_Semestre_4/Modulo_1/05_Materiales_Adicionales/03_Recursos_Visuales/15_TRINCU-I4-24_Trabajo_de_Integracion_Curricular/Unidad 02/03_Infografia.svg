<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Un plan de acción con evidencia</title><desc id="descripcion">Hitos. Organiza configuración, prueba y medición en el cronograma. Responsables. Asigna una persona, fecha y dependencia por hito. Cierre. Define qué evidencia mostrará que el hito se cumplió. Un cronograma útil permite controlar avances y ajustar el plan.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#fbebdc" stroke="#fbebdc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="245" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 162.5) scale(0.825)"><path d="M64 22h77l28 25v131H64Z" fill="#fbebdc" stroke="#70493b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M41 17h77l28 25v128H41Z" fill="#ffffff" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 17v25h28Z" fill="#dff0e9" stroke="#1c3747" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="57" width="73" height="61" rx="12" fill="#fbebdc"/><g transform="translate(65.0 61.0) scale(0.54)"><path d="M15 26h70v57H15z M15 41h70 M32 17v17 M68 17v17 M31 55h7 M47 55h7 M63 55h7 M31 68h7 M47 68h7" fill="none" stroke="#70493b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="57" y="130" width="70" height="5" rx="2" fill="#1c3747"/><rect x="57" y="142" width="49" height="5" rx="2" fill="#70493b"/></g><text x="220" y="389" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Hitos</text><text x="220" y="429" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Organiza configuración,</text><text x="220" y="460" fill="#364e5a" font-