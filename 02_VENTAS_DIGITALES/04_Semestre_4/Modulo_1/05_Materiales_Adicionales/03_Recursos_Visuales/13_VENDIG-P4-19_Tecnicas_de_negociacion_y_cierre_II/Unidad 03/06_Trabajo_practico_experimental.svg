<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo practico experimental. Cierre y acuerdos comerciales de alto valor</title><desc id="descripcion">Diseño de una propuesta comercial escalonada con 3 niveles de inversión acompañada de una simulación final de roles (*role-playing*) de cierre comercial ante un comité de compras, conservando la interacción y la evidencia oral mediante **audios o videos e intercambios secuenciales asincrónicos** dentro del mismo expediente en Moodle al cierre de la semana 6. Consulte la guía detallada en la Práctica 3 de la Guía de Prácticas. Resumen visual: Diseña 3 niveles de inversión; Simula el cierre ante el comité; Registra el intercambio y la evidencia oral. Evidencia: Oferta escalonada y simulación grabada.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#235c83" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e6f0f8"/><circle cx="114" cy="86" r="23" fill="#235c83"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#efe3f2" stroke="#6c4977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff" /><ns0:g transform="translate(53.0 52.0) scale(0.96)"><ns0:path d="M16 25h22v56H16z M42 25h20v56H42z M66 25h18v