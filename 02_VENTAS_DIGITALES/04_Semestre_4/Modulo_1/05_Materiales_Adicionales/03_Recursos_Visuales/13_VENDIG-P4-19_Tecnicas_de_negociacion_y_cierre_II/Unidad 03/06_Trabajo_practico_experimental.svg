29" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">el comité</text><circle cx="1010" cy="165" r="92" fill="#e6f0f8"/><circle cx="934" cy="86" r="23" fill="#235c83"/><text x="934" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(936 91) scale(0.74)"><ns0:path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#efe3f2" stroke="#6c4977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff" /><ns0:g transform="translate(53.0 52.0) scale(0.96)"><ns0:path d="M58 34a9 9 0 1 1-18 0 9 9 0 0 1 18 0z M31 48a8 8 0 1 1-16 0 8 8 0 0 1 16 0z M84 48a8 8 0 1 1-16 0 8 8 0 0 1 16 0z M34 77v-9a15 15 0 0 1 30 0v9z M10 75v-7a13 13 0 0 1 19-12 M71 56a13 13 0 0 1 19 12v7" fill="none" stroke="#6c4977" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#dca46c" stroke="#dca46c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><text x="1010" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Registra el</text><text x="1010" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">intercambio y la</text><text x="1010" y="364" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">evidencia oral</text><path d="M1010 432V465Q1010 480 995 480H614Q600 480 600 495V509" fill="none" stroke="#235c83" stroke-width="3" marker-end="url(#flecha)"/><path d="M160 510H1014Q1044 510 1044 540V651Q1044 681 1014 681H160Q130 681 130 651V540Q130 510 160 510Z" fill="#e6f0f8"/><path d="M165 541H205L225 561V642H165ZM205 541V561H225M177 580H212M177 593H212M177 606H203" fill="white" stroke="#235c83" stroke-width="3" stroke-linejoin="round"/><text x="254" y="546" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#235c83" text-anchor="start">PRODUCTO DEL TRABAJO PRÁCTICO</text><text x="254" y="585" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="start">Oferta escalonada y simulación grabada</text></svg>