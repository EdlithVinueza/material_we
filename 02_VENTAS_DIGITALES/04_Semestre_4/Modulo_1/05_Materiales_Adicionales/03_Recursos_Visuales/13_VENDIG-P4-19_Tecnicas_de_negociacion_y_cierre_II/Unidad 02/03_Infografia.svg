<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Cómo retomar una conversación en pausa</title><desc id="descripcion">Revisa. Comprueba la fecha y el compromiso acordados. Pregunta. Consulta si falta evidencia o conviene revisar el plazo. Registra. Anota la respuesta o el siguiente punto de contacto. El silencio admite varias explicaciones. Pregunta con respeto.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#efe3f2" stroke="#efe3f2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="245" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 162.5) scale(0.825)"><path d="M64 22h77l28 25v131H64Z" fill="#efe3f2" stroke="#6c4977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M41 17h77l28 25v128H41Z" fill="#ffffff" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 17v25h28Z" fill="#f9ead2" stroke="#1c3747" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="57" width="73" height="61" rx="12" fill="#efe3f2"/><g transform="translate(65.0 61.0) scale(0.54)"><path d="M15 26h70v57H15z M15 41h70 M32 17v17 M68 17v17 M31 55h7 M47 55h7 M63 55h7 M31 68h7 M47 68h7" fill="none" stroke="#6c4977" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="57" y="130" width="70" height="5" rx="2" fill="#1c3747"/><rect x="57" y="142" width="49" height="5" rx="2" fill="#6c4977"/></g><text x="220" y="389" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Revisa</text><text x="220" y="429" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Comprueba la fecha y</text><text x="220" y="460" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">el compromiso</text><text x="220" y="491" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">acordados.</text><ellipse cx="600" cy="298" rx="115" ry="103" fill="#f9ead2"/><g transform="translate(517.5 215.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#efe3f2" stroke="#6c4977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M14 24h69v47H47L28 84V71H14z M29 39h39 M29 52h26" fill="none" stroke="#6c4977" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#dca46c" stroke="#dca46c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="600" y="442" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Pregunta</text><text x="600" y="482" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Consulta si falta</text><text x="600" y="513" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">evidencia o conviene</text><text x="600" y="544" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">revisar el plazo.</text><ellipse cx="980" cy="245" rx="115" ry="103" fill="#ffffff"/><g transform="translate(897.5 162.5) scale(0.825)"><path d="M64 22h77l28 25v131H64Z" fill="#efe3f2" stroke="#6c4977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M41 17h77l28 25v128H41Z" fill="#ffffff" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 17v25h28Z" fill="#f9ead2" stroke="#1c3747" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="5