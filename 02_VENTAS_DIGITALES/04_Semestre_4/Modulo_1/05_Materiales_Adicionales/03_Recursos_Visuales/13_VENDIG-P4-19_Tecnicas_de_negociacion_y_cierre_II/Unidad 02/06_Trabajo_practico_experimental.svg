font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">chat y correo</text><circle cx="1010" cy="165" r="92" fill="#e6f0f8"/><circle cx="934" cy="86" r="23" fill="#235c83"/><text x="934" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(936 91) scale(0.74)"><ns0:rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747" /><ns0:rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff" /><ns0:rect x="24" y="43" width="152" height="15" rx="9" fill="#efe3f2" /><ns0:circle cx="33" cy="50" r="2" fill="#6c4977" /><ns0:circle cx="41" cy="50" r="2" fill="#6c4977" /><ns0:circle cx="49" cy="50" r="2" fill="#6c4977" /><ns0:rect x="35" y="67" width="93" height="64" rx="7" fill="#efe3f2" /><ns0:g transform="translate(51.5 69.5) scale(0.59)"><ns0:path d="M18 20v59h67 M29 69V51h12v18 M48 69V39h12v30 M67 69V25h12v44" fill="none" stroke="#6c4977" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:rect x="138" y="71" width="23" height="8" rx="4" fill="#dca46c" /><ns0:rect x="137" y="86" width="25" height="5" rx="2" fill="#1c3747" /><ns0:rect x="137" y="98" width="23" height="5" rx="2" fill="#6c4977" /><ns0:path d="M18 151h164l17 13v8H1v-8z" fill="#efe3f2" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><text x="1010" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Conserva grabación</text><text x="1010" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">y turnos</text><text x="1010" y="364" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">asincrónicos</text><path d="M1010 432V465Q1010 480 995 480H614Q600 480 600 495V509" fill="none" stroke="#235c83" stroke-width="3" marker-end="url(#f