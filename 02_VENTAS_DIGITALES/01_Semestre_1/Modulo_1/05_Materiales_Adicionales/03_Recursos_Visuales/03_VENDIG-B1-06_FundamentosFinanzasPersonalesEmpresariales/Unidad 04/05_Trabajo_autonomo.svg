<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo autonomo. Uso de herramientas básicas para control financiero personal</title><desc id="descripcion">Criterios de un registro digital verificable. Relacionar la matriz de presupuesto de las lecturas con el material de la unidad; explicar cómo verificar una entrada, una salida, un duplicado y una copia de respaldo en una sola ficha. Definir indicador de ahorro, base de cálculo y lista de revisión financiera personal con datos exclusivamente ficticios. En el mismo producto, explicar reporte básico de salud financiera con datos simulados. Evidencia: Una lista razonada de campos, categorías y controles con un ejemplo de conciliación. Se prepara en la semana 7 y se revisa y entrega una vez al cierre de la semana 8. Resumen visual: Define campos y controles; Explica duplicados, respaldo y ahorro; Ejemplifica una conciliación. Evidencia: Lista razonada con cálculo de ejemplo.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#21685e" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e5f2ed"/><circle cx="114" cy="86" r="23" fill="#21685e"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:path d="M64 22h77l28 25v131H64Z" fill="#efe3f2" stroke="#6c4977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M41 17h77l28 25v128H41Z" fill="#ffffff" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M118 17v25h28Z" fill="#f9ead2" stroke="#1c3747" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:rect x="56" y="57" width="73" height="61" rx="12" fill="#efe3f2" /><ns0:g transform="translate(65.0 61.0) scale(0.54)"><ns0:path d="M27 12h35l15 15v61H27z M62 12v16h15 M38 46h28 M38 57h28 M38 68h19" fill="none" stroke="#6c4977" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:rect x="57" y="130" width="70" height="5" rx="2" fill="#1c3747" /><ns0:rect x="57" y="142" width="49" height="5" rx="2" fill="#6c4977" /></ns0:g><text x="190" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Define campos y</text><text x="190" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">controles</text><circle cx="600" cy="165" r="92" fill="#e5f2ed"/><circle cx="524" cy="86" r="23" fill="#21685e"/><text x="524" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(526 91) scale(0.74)"><ns0:rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747" /><ns0:rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff" /><ns0:rect x="24" y="43" width="152" height="15" rx="9" fill="#efe3f2" /><ns0:circle cx="33" cy="50" r="2" fill="#6c4977" /><ns0:circle cx="41" cy="50" r="2" fill="#6c4977" /><ns0:circle cx="49" cy="50" r="2" fill="#6c4977" /><ns0:rect x="35" y="67" width="93" height="64" rx="7" fill="#efe3f2" /><ns0:g transform="translate(51.5 69.5) scale(0.59)"><ns0:path d="M15 24h70v53H15z M15 39h70 M15 52h70 M15 65h70 M37 39v38 M61 39v38 M23 31h11" fill="none" stroke="#6c4977" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:rect x="138" y="71" width="23" height="8" rx="4" fill="#dca46c" /><ns0:rect x="137" y="86" width="25" height="5" rx="2" fill="#1c3747" /><ns0:rect x="137" y="98" width="23" height="5" rx="2" fill="#6c4977" /><ns0:path d="M18 151h164l17 13v8H1v-8z" fill="#efe3f2" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><text x="600" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Explica duplicados,</text><text x="600" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">respaldo y ahorro</text><circle cx="1010" cy="165" r="92" fill="#e5f2ed"/><circle cx="934" cy="86" r="23" fill="#21685e"/><text x="934" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(936 91) scale(0.74)"><ns0:path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#efe3f2" stroke="#6c4977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff" /><ns0:g transform="translate(53.0 52.0) scale(0.96)"><ns0:path d="M83 46v4a33 33 0 1 1-16-28 M34 49l13 13 33-34" fill="none" stroke="#6c4977" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#dca46c" stroke="#dca46c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><text x="1010" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Ejemplifica una</text><text x="1010" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">conciliación</text><path d="M1010 432V465Q1010 480 995 480H614Q600 480 600 495V509" fill="none" stroke="#21685e" stroke-width="3" marker-end="url(#flecha)"/><path d="M160 510H1014Q1044 510 1044 540V651Q1044