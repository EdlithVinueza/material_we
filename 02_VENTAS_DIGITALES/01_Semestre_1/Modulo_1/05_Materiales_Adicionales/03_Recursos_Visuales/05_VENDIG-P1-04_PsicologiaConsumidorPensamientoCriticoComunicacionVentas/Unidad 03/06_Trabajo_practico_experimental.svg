<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo practico experimental. Neuromarketing y el Funcionamiento de la Mente Humana</title><desc id="descripcion">Revisión crítica de dos mensajes comerciales. Utilice el mismo caso introductorio y los datos y pasos de la guía de prácticas. La preparación, las pruebas y los ajustes se integran en un único expediente entregado al cierre de la semana 6. Resumen visual: Compara dos piezas y detecta promesas; Reescribe el mensaje sin afirmaciones dudosas; Diseña una prueba con un solo cambio. Evidencia: Análisis, mensajes revisados y tabla de prueba.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#235c83" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e6f0f8"/><circle cx="114" cy="86" r="23" fill="#235c83"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:rect x="48" y="22" width="108" height="160" rx="22" fill="#1c3747" /><ns0:rect x="55" y="33" width="94" height="137" rx="17" fill="#ffffff" /><ns0:rect x="83" y="28" width="37" height="8" rx="4" fill="#1c3747" /><ns0:rect x="68" y="48" width="69" height="51" rx="9" fill="#fbebdc" /><ns0:g transform="translate(82.0 52.0) scale(0.42)"><ns0:path d="M14 20h72v60H14z M14 32h72 M43 43l16 10-16 10z M22 26h4 M30 26h4" fill="none" stroke="#70493b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:rect x="68" y="112" width="56" height="6" rx="3" fill="#70493b" /><ns0:rect x="68" y="127" width="62" height="6" rx="3" fill="#fbebdc" /><ns0:rect x="68" y="143" width="44" height="6" rx="3" fill="#fbebdc" /></ns0:g><text x="190" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Compara dos piezas</text><text x="190" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">y detecta promesas</text><circle cx="600" cy="165" r="92" fill="#e6f0f8"/><circle cx="524" cy="86" r="23" fill="#235c83"/><text x="524" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(526 91) scale(0.74)"><ns0:path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#fbebdc" stroke="#70493b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff" /><ns0:g transform="translate(53.0 52.0) scale(0.96)"><ns0:path d="M68 66l17 17 M73 45a27 27 0 1 1-54 0 27 27 0 0 1 54 0z M37 45h18 M46 36v18" fill="none" stroke="#70493b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#64a995" stroke="#64a995" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><text x="600" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Reescribe el</text><text x="600" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">mensaje sin</text><text x="600" y="364" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">afirmaciones</text><text x="600" y="399" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">dudosas</text><circle cx="1010" cy="165" r="92" fill="#e6f0f8"/><circle cx="934" cy="86" r="23" fill="#235c83"/><text x="934" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(936 91) scale(0.74)"><ns0:path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#fbebdc" stroke="#70493b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff" /><ns0:g transform="translate(53.0 52.0) scale(0.96)"><ns0:path d="M83 46v4a33 33 0 1 1-16-28 M34 49l13 13 33-34" fill="none" stroke="#70493b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#64a995" stroke="#64a995" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><text x="1010" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Diseña una prueba</text><text x="1010" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">con un solo cambio</text><path d="M1010 432V465Q1010 480 995 480H614Q600 480 600 495V509" fill="none" stroke="#235c83" stroke-width="3" marker-end="url(#flecha)"/><path d="M160 510H1014Q1044 510 1044 540V651Q1044 681 1014 681H160Q130 681 130 651V540Q130 510 160 510Z" fill="#e6f0f8"/><path d="M165 541H205L225 561V642H165ZM205 541V561H225M177 580H212M177 593H212M177 606H203" fill="white" stroke="#235c83" stroke-width="3" stroke-linejoin="round"/><text x="254" y="546" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#235c83" text-anchor="start">PRODUCTO DEL TRABAJO PRÁCTICO</text><text x="254" y="585" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="start">Análisis, mensajes revisados y tabla de prueba</text></svg>