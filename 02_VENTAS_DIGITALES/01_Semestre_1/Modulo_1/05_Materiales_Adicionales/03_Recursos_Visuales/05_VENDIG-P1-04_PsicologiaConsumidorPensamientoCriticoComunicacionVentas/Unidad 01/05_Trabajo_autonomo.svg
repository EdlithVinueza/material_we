<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo autonomo. Fundamentos del Consumidor Digital y Transformación Tecnológica</title><desc id="descripcion">Ficha crítica de comportamiento digital. Definir búsqueda, evaluación y decisión; identificar el contexto del estudio recibido y explicar qué permite y qué no permite concluir, en un solo documento. Explicar evolución del consumidor y acceso móvil con el contexto de las lecturas; el dispositivo no registrado se identifica como dato ausente. En el mismo producto, explicar contexto del covid-19 y consolidación de los medios digitales. Evidencia: Una ficha de conceptos y una comparación de un pasaje general con un resultado del estudio de Imbabura. Se prepara en la semana 1 y se revisa y entrega una vez al cierre de la semana 2. Resumen visual: Define búsqueda, evaluación y decisión; Compara un pasaje y el estudio de Imbabura; Distingue evidencia y dato ausente. Evidencia: Ficha crítica del comportamiento digital.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#21685e" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e5f2ed"/><circle cx="114" cy="86" r="23" fill="#21685e"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:path d="M64 22h77l28 25v131H64Z" fill="#fbebdc" stroke="#70493b" stroke-width="2" stroke-linecap="round" stroke-linejoin="r