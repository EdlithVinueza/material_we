<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Mirar la conducta antes de interpretarla</title><desc id="descripcion">Observación. Una persona comparó dos productos y abandonó el sitio. Hipótesis. Quizá faltó información para decidir. Comprobación. Pregunta qué buscaba en el último paso. La secuencia muestra dónde investigar.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#fbebdc" stroke="#fbebdc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="297" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 214.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#fbebdc" stroke="#70493b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M36 22l6 57 13-16 14 20 8-6-15-19 21-3z M15 29h11 M24 13l6 9 M48 12l-3 10 M14 48l10-5" fill="none" stroke="#70493b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#64a995" stroke="#64a995" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220" y="441" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Observación</text><text x="220" y="481" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Una persona comparó</text><text x="220" y="512" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">dos productos y</text><text x="220" y="543" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">abandonó el sitio.</