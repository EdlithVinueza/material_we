<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Una oferta transparente</title><desc id="descripcion">Comprueba. Verifica el stock y el plazo antes de promoverlos. Explica. Publica precio y condiciones donde se puedan encontrar. Responde. Asigna a alguien para corregir información o atender dudas. Una promesa pública tiene que coincidir con la operación.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#e0ebfa" stroke="#e0ebfa" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="245" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 162.5) scale(0.825)"><path d="M29 79L100 49l71 30-71 34z" fill="#fcebdd" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M29 79v65l71 32v-63z" fill="#e0ebfa" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M171 79v65l-71 32v-63z" fill="#de946d" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M67 64l70 34v29" fill="none" stroke="#275892" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(42.5 98.5) scale(0.45)"><path d="M14 34l36-18 36 18-36 18z M14 34v35l36 17 36-17V34 M50 52v34 M32 25l35 17" fill="none" stroke="#275892" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="220" y="389" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Comprueba</text><text x="220" y="429" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Verifica el stock y el</text><text x="220" y="460" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">plazo antes de</text>