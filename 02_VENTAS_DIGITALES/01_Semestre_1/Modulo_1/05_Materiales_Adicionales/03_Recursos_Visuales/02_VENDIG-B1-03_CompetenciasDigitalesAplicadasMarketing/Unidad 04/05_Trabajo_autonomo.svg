<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo autonomo. Seguridad Digital y Protección de Datos</title><desc id="descripcion">Matriz de riesgos y controles. Leer el material de seguridad e identificar riesgos de recolección, acceso, intercambio y respaldo en un mismo registro comentado. Relacionar seguridad y publicidad orgánica con finalidad, minimización, tratamiento de clientes activos e inactivos y responsabilidad social; no atribuir artículos legales ausentes. Evidencia: Una matriz que relacione cuatro riesgos con un control, un responsable y una evidencia de comprobación. Se prepara en la semana 7 y se revisa y entrega una vez al cierre de la semana 8. Resumen visual: Identifica 4 riesgos del registro; Relaciona cada riesgo con un control; Indica responsable y verificación. Evidencia: Matriz de riesgos y controles.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#21685e" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e5f2ed"/><circle cx="114" cy="86" r="23" fill="#21685e"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747" /><ns0:rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff" /><ns0:rect x="24" y="43" width="152" height="15" rx="9" fill="#e0ebfa" /><ns0:circle cx="33" cy="50" r="2" fill="#275892" /><ns0:circle cx="41" cy="50" r="2" fill="#275892" /><ns0:circle cx="49" cy="50" r="2" fill="#275892" /><ns0:rect x="35" y="67" width="93" height="64" rx="7" fill="#e0ebfa" /><ns0:g transform="translate(51.5 69.5) scale(0.59)"><ns0:path d="M15 24h70v53H15z M15 39h70 M15 52h70 M15 65h70 M37 39v38 M61 39v38 M23 31h11" fill="none" stroke="#275892" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:rect x="138" y="71" width="23" height="8" rx="4" fill="#de946d" /><ns0:rect x="137" y="86" width="25" height="5" rx="2" fill="#1c3747" /><ns0:rect x="137" y="98" width="23" height="5" rx="2" fill="#275892" /><ns0:path d="M18 151h164l17 13v8H1v-8z" fill="#e0ebfa" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><text x="190" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Identifica 4 riesgos</text><text x="190" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">del registro</text><circle cx="600" cy="165" r="92" fill="#e5f2ed"/><circle cx="524" cy="86" r="23" fill="#21685e"/><text x="524" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(526 91) scale(0.74)"><ns0:path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e0ebfa" stroke="#275892" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff" /><ns0:g transform="translate(53.0 52.0) scale(0.96)"><ns0:path d="M50 15l37 66H13z M50 38v18 M50 67v2" fill="none" stroke="#275892" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#de946d" stroke="#de946d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><text x="600" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Relaciona cada</text><text x="600" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">riesgo con un</text><text x="600" y="364" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">control</text><circle cx="1010" cy="165" r="92" fill="#e5f2ed"/><circle cx="934" cy="86" r="23" fill="#21685e"/><text x="934" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(936 91) scale(0.74)"><ns0:path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e0ebfa" stroke="#275892" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff" /><ns0:g transform="translate(53.0 52.0) scale(0.96)"><ns0:path d="M50 14l30 12v22c0 17-14 29-30 38-16-9-30-21-30-38V26z M37 48l9 9 18-19" fill="none" stroke="#275892" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#de946d" stroke="#de946d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><text x="1010" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Indica responsable y</text><text x="1010" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">verificación</text><path d="M1010 432V465Q1010 480 995 480H614Q600 480 600 495V509" fill="none" stroke="#21685e" stroke-width="3" marker-end="url(#flecha)"/><path d="M160 510H1014Q1044 510 1044 540V651Q1044 681 1014 681H160Q130 681 130 651V540Q130 510 160 510Z" fill="#e5f2ed"/><path d="M165 541H205L225 561V642H165ZM205 541V561H225M177 580H212M177 593H212M177 606H203" fill="wh