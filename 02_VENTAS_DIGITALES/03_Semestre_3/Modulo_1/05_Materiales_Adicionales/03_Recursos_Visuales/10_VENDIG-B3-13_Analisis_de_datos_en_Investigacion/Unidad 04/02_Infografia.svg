<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Comprueba una sugerencia analítica de IA</title><desc id="descripcion">Sugerencia. El asistente propone una fórmula para ventas. Prueba. Compárala en filas con resultado conocido y celdas vacías. Validación. Corrige base, fórmula o texto antes de integrar. La verificación humana precede al informe.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#fbebdc" stroke="#fbebdc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="297" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 214.5) scale(0.825)"><rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747"/><rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff"/><rect x="24" y="43" width="152" height="15" rx="9" fill="#fbebdc"/><circle cx="33" cy="50" r="2" fill="#70493b"/><circle cx="41" cy="50" r="2" fill="#70493b"/><circle cx="49" cy="50" r="2" fill="#70493b"/><rect x="35" y="67" width="93" height="64" rx="7" fill="#fbebdc"/><g transform="translate(51.5 69.5) scale(0.59)"><path d="M24 31h52a6 6 0 0 1 6 6v36H18V37a6 6 0 0 1 6-6z M50 31V20 M46 17h8 M18 48h-7v14h7 M82 48h7v14h-7 M33 49h4 M63 49h4 M41 62h18" fill="none" stroke="#70493b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="138" y="71" width="23" height="8" rx="4" fill="#64a995"/><rect x="137" y="86" width="25" height="5" rx="2" fill="#1c3747"/><rect x="137" y="98" width="23" height="5" rx="2" fill="#70493b"/><path d="M18 151h164l17 13v8H1v-8z" fill="#fbebdc" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220" y="441" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Sugerencia</text><text x="220"