<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">De un segmento a una recomendación</title><desc id="descripcion">Hallazgo. Un grupo no compra desde hace varios meses. Acción. Prueba un seguimiento útil, sujeto a su preferencia de contacto. Revisión. Mide respuesta sobre el grupo elegible y explica sus límites. Cada propuesta debe rastrearse hasta un hallazgo.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#fbebdc" stroke="#fbebdc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="245" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 162.5) scale(0.825)"><rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747"/><rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff"/><rect x="24" y="43" width="152" height="15" rx="9" fill="#fbebdc"/><circle cx="33" cy="50" r="2" fill="#70493b"/><circle cx="41" cy="50" r="2" fill="#70493b"/><circle cx="49" cy="50" r="2" fill="#70493b"/><rect x="35" y="67" width="93" height="64" rx="7" fill="#fbebdc"/><g transform="translate(51.5 69.5) scale(0.59)"><path d="M31 25h1 M21 36h1 M36 43h1 M28 50h1 M72 20h1 M61 29h1 M76 35h1 M68 43h1 M63 66h1 M75 61h1 M82 76h1 M67 82h1" fill="none" stroke="#70493b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="138" y="71" width="23" height="8" rx="4" fill="#64a995"/><rect x="137" y="86" width="25" height="5" rx="2" fill="#1c3747"/><rect x="137" y="98" width="23" height="5" rx="2" fill="#70493b"/><path d="M18 151h164l17 13v8H1v-8z" fill="#fbebdc" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220" y="389" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Hallazgo</text><text x="220" y="429" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Un grupo no compra</text><text x="220" y="460" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">desde hace varios</text><text x="220" y="491" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">meses.</text><ellipse cx="600" cy="298" rx="115" ry="103" fill="#dff0e9"/><g transform="translate(517.5 215.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#fbebdc" stroke="#70493b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M79 39a34 34 0 1 1-20-20 M66 43a18 18 0 1 1-9-10 M49 51l35-35 M72 15h13v13" fill="none" stroke="#70493b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#64a995" stroke="#64a995" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="600" y="442" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Acción</text><text x="600" y="482" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Prueba un seguimiento</text><text x="600" y="513" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">útil, sujeto a su</text><text x="600" y="544" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">preferencia de</text><text x="600" y="575" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">contacto.</text><ellipse cx="980" cy="245" rx="115" ry="103" fill="#ffffff"/><g transform="translate(897.5 162.5) scale(0.825)"><rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747"/