<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo autonomo. Visualización e interpretación para la toma de decisiones</title><desc id="descripcion">En la semana 5, lectura comprensiva de los capítulos 4 y 5 de Lafuente Blasco (2025) sobre representación gráfica y cruce de variables junto con un **análisis crítico de visualizaciones comerciales** (corrigiendo casos con escalas distorsionadas); en la semana 6, **ajuste de formato, jerarquía visual y presentación estética** del tablero comercial, entregando un solo documento o archivo integrado al cierre de la semana 6 en Moodle. Resumen visual: Revisa gráficos y escalas distorsionadas; Corrige la representación; Ajusta la jerarquía del tablero. Evidencia: Análisis visual y tablero ajustado.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#21685e" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e5f2ed"/><circle cx="114" cy="86" r="23" fill="#21685e"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747" /><ns0:rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff" /><ns0:rect x="24" y="43" width="152" height="15" rx="9" fill="#fbebdc" /><ns0:circle cx="33" cy="50" r="2" fill="#70493b" /><ns0:circle cx="41" cy="50" r="2" fill="#70493b" /><ns0:circle cx="49" cy="50" r="2" 