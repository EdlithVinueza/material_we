<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Mensajes según la etapa del cliente</title><desc id="descripcion">Bienvenida. Explica cómo empezar y cuál es el próximo paso. Reactivación. Comprueba interés y pertinencia antes de contactar. Posventa. Resuelve dudas y deriva a una persona si hace falta. Cada secuencia necesita una condición para detenerse.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#e0ebfa" stroke="#e0ebfa" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="297" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 214.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e0ebfa" stroke="#275892" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M13 25h74v51H13z M14 28l36 27 36-27 M14 74l24-24 M86 74L63 50" fill="none" stroke="#275892" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#de946d" stroke="#de946d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220" y="441" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Bienvenida</text><text x="220" y="481" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Explica cómo empezar</text><text x="220" y="512" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">y cuál es el próximo</text><text x="220" y="543" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">paso.</text