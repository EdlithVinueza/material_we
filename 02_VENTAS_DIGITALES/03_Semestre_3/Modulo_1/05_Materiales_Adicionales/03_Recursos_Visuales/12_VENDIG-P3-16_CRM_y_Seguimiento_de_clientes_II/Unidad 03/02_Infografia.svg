<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Dos componentes de la puntuación</title><desc id="descripcion">Perfil. Mide si la cuenta encaja por sector o tipo de compra. Conducta. Mide señales observables, como solicitar una demostración. Control. Evita contar dos veces el mismo evento. La prioridad se explica con ambas dimensiones.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#e0ebfa" stroke="#e0ebfa" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="297" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 214.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e0ebfa" stroke="#275892" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M65 31a15 15 0 1 1-30 0 15 15 0 0 1 30 0z M20 82v-8c0-16 14-25 30-25s30 9 30 25v8z" fill="none" stroke="#275892" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#de946d" stroke="#de946d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220" y="441" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Perfil</text><text x="220" y="481" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Mide si la cuenta</text><text x="220" y="512" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">encaja por sector o tipo</text><text x="220" y="543" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">de compra.</text><ellipse cx="600" cy="239" rx="115" ry="103" fill="#fcebdd"/><g transform="translate(517.5 156.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e0ebfa" stroke="#275892" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M36 22l6 57 13-16 14 20 8-6-15-19 21-3z M15 29h11 M24 13l6 9 M48 12l-3 10 M14 48l10-5" fill="none" stroke="#275892" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#de946d" stroke="#de946d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="600" y="383" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Conducta</text><text x="600" y="423" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Mide señales</text><text x="600" y="454" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">observables, como</text><text x="600" y="485" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">solicitar una</text><text x="600" y="516" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">demostración.</text><ellipse cx="980" cy="297" rx="115" ry="103" fill="#ffffff"/><g transform="translate(897.5 214.5) scale(0.825)"><path d="M64 22h77l28 25v131H64Z" fill="#e0ebfa" stroke="#275892" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M41 17h77l28 25v128H41Z" fill="#ffffff" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 17v25h28Z" fill="#fcebdd" stroke="#1c3747" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="57" width="73" height="61" rx="12" fill="#e0ebfa"/>