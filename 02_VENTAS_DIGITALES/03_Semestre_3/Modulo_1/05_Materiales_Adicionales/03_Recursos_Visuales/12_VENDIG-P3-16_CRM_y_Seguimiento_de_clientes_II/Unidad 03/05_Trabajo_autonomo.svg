<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo autonomo. Inteligencia artificial, lead scoring y comportamiento del cliente</title><desc id="descripcion">Lectura del capítulo 12 de Prior, Buttle y Maklan (2024) en la semana 5 sobre puntuación y priorización de oportunidades, combinada en la semana 6 con la resolución de un **cuestionario aplicado de puntuación de prospectos (*lead scoring*)**, entregando un solo producto en Moodle al cierre de la semana 6. Resumen visual: Revisa criterios de puntuación; Analiza cómo priorizar oportunidades; Resuelve el cuestionario aplicado. Evidencia: Cuestionario de puntuación de prospectos.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#21685e" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e5f2ed"/><circle cx="114" cy="86" r="23" fill="#21685e"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:path d="M64 22h77l28 25v131H64Z" fill="#e0ebfa" stroke="#275892" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M41 17h77l28 25v128H41Z" fill="#ffffff" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M118 17v25h28Z" fill="#fcebdd" stroke="#1c3747" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:rect x="56" y="57" width="73" height="61" rx="12" fill="#e0ebfa