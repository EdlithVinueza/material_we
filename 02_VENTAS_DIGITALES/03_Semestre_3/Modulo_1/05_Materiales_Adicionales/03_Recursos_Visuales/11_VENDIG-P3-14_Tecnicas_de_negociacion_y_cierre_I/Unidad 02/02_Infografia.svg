<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Las cuatro preguntas de SPIN</title><desc id="descripcion">Situación y problema. ¿Qué sistema usan y qué errores aparecen? Implicación. ¿Qué efecto tienen esos errores en el despacho? Necesidad de solución. ¿Qué valor tendría resolverlos? Las respuestas orientan la siguiente pregunta.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#dceee7" stroke="#dceee7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="297" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 214.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#dceee7" stroke="#21685e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M65 31a15 15 0 1 1-30 0 15 15 0 0 1 30 0z M20 82v-8c0-16 14-25 30-25s30 9 30 25v8z" fill="none" stroke="#21685e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#ebc873" stroke="#ebc873" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220" y="441" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Situación y</text><text x="220" y="477" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">problema</text><text x="220" y="514" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">¿Qué sistema usan y</text><text x="220" y="545" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">qué errores aparecen?</text><ellipse cx="600" cy="239" rx="115" ry="103" fill="#fff2cc"/><g transform="translate(517.5 156.5) scale(0.825)"><rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747"/><rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff"/><rect x="24" y="43" width="152" height="15" rx="9" fill="#dceee7"/><circle cx="33" cy="50" r="2" fill="#21685e"/><circle cx="41" cy="50" r="2" fill="#21685e"/><circle cx="49" cy="50" r="2" fill="#21685e"/><rect x="35" y="67" width="93" height="64" rx="7" fill="#dceee7"/><g transform="translate(51.5 69.5) scale(0.59)"><path d="M18 23v55h65 M26 66l16-16 13 5 23-22 M66 33h12v12" fill="none" stroke="#21685e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="138" y="71" width="23" height="8" rx="4" fill="#ebc873"/><rect x="137" y="86" width="25" height="5" rx="2" fill="#1c3747"/><rect x="137" y="98" width="23" height="5" rx="2" fill="#21685e"/><path d="M18 151h164l17 13v8H1v-8z" fill="#dceee7" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="600" y="383" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Implicación</text><text x="600" y="423" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">¿Qué efecto tienen</text><text x="600" y="454" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">esos errores en el</text><text x="600" y="485" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">despacho?</text><ellipse cx="980" cy="297" rx="115" ry="103" fill="#ffffff"/><g transform="translate(897.5 214.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#dceee7" stroke="#21685e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) sca