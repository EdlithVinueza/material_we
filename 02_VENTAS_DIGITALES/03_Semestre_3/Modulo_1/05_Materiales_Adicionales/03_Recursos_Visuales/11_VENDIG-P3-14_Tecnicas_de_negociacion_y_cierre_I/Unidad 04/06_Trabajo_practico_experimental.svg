<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo practico experimental. Estrategias básicas de cierre y seguimiento digital</title><desc id="descripcion">En la semana 7, práctica de juego de roles (role-playing) de cierre comercial y redacción de minuta digital sin papel; en la semana 8, integración del **proyecto final con una simulación integral grabada en audio o video asincrónico de una conversación de venta completa desde las preguntas SPIN hasta el cierre**, acompañada del correo de confirmación, registro en el sistema de gestión de relaciones con clientes y programación de la incorporación inicial. El procedimiento completo figura en la Práctica 4 de la Guía de Prácticas y se entrega al cierre de la semana 8. Resumen visual: Graba la venta desde SPIN hasta el cierre; Redacta minuta y correo de confirmación; Registra la venta y agenda la incorporación. Evidencia: Simulación, compromisos y seguimiento en CRM.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#235c83" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e6f0f8"/><circle cx="114" cy="86" r="23" fill="#235c83"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:path d="M64 22h77l28 25v131H64Z" fill="#dceee7" stroke="#21685e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M41 17h77l28 25v128H41Z" fi