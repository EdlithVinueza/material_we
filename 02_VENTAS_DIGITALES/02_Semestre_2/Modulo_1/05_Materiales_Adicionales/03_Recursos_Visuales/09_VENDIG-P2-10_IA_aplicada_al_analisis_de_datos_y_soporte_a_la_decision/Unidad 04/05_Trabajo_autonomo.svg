<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo autonomo. Patrones del cliente, decisión operativa y aplicación ética de IA</title><desc id="descripcion">En la semana 7, elaboración de un **informe de recomendaciones comerciales** para la gerencia de ventas basado en escenarios cuantitativos; en la semana 8, lectura comprensiva de los capítulos 4 y 7 de Crawford (2022) (apoyada por los criterios de interpretación del capítulo 4 de Juca-Maldonado, 2026 y capítulo 4 de Etesse, 2024) para redactar un **ensayo reflexivo sobre ética, privacidad y costos de la inteligencia artificial en ventas**, integrando ambos componentes en un único envío en Moodle al cierre de la semana 8. Resumen visual: Compara escenarios cuantitativos; Formula recomendaciones comerciales; Reflexiona sobre privacidad, ética y costos. Evidencia: Informe y ensayo reflexivo.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#21685e" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e5f2ed"/><circle cx="114" cy="86" r="23" fill="#21685e"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:path d="M64 22h77l28 25v131H64Z" fill="#e1f0f3" stroke="#1d6c78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M41 17h77l28 25v128H41Z" fill="#ffffff" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M118 17v25h28Z" fill="#fbeadb" stroke="#1c3747" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:rect x="56" y="57" width="73" height="61" rx="12" fill="#e1f0f3" /><ns0:g transform="translate(65.0 61.0) scale(0.54)"><ns0:path d="M22 14h58v72H22z M34 28h32 M34 42h20 M34 71v-9 M45 71V52 M56 71V56 M67 71V47" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:rect x="57" y="130" width="70" height="5" rx="2" fill="#1c3747" /><ns0:rect x="57" y="142" width="49" height="5" rx="2" fill="#1d6c78" /></ns0:g><text x="190" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Compara escenarios</text><text x="190" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">cuantitativos</text><circle cx="600" cy="165" r="92" fill="#e5f2ed"/><circle cx="524" cy="86" r="23" fill="#21685e"/><text x="524" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(526 91) scale(0.74)"><ns0:rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747" /><ns0:rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff" /><ns0:rect x="24" y="43" width="152" height="15" rx="9" fill="#e1f0f3" /><ns0:circle cx="33" cy="50" r="2" fill="#1d6c78" /><ns0:circle cx="41" cy="50" r="2" fill="#1d6c78" /><ns0:circle cx="49" cy="50" r="2" fill="#1d6c78" /><ns0:rect x="35" y="67" width="93" height="64" rx="7" fill="#e1f0f3" /><ns0:g transform="translate(51.5 69.5) scale(0.59)"><ns0:path d="M18 20v59h67 M29 69V51h12v18 M48 69V39h12v30 M67 69V25h12v44" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:rect x="138" y="71" width="23" height="8" rx="4" fill="#db9875" /><ns0:rect x="137" y="86" width="25" height="5" rx="