<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo practico experimental. Patrones del cliente, decisión operativa y aplicación ética de IA</title><desc id="descripcion">Resolución de un estudio de caso de ajuste de promociones basado en datos y ejecución de una auditoría ética sobre un conjunto de datos comerciales para identificar sesgos de representación, riesgos de reidentificación y medidas de gobernanza. El detalle completo figura en la Práctica 4 de la Guía de Prácticas y se entrega al cierre de la semana 8. Resumen visual: Estima el efecto de una promoción; Identifica sesgos y riesgo de reidentificación; Formula medidas de gobernanza. Evidencia: Escenarios, auditoría ética y controles.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#235c83" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e6f0f8"/><circle cx="114" cy="86" r="23" fill="#235c83"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e1f0f3" stroke="#1d6c78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff" /><ns0:g transform="translate(53.0 52.0) scale(0.96)"><ns0:path d="M50 14l30 12v22c0 17-14 29-30 38-16-9-30-21-30-38V26z M37 48l9 9 18-19" fill="none" stroke="#1d