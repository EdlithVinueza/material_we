le">reidentificación</text><circle cx="1010" cy="165" r="92" fill="#e6f0f8"/><circle cx="934" cy="86" r="23" fill="#235c83"/><text x="934" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(936 91) scale(0.74)"><ns0:path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e1f0f3" stroke="#1d6c78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff" /><ns0:g transform="translate(53.0 52.0) scale(0.96)"><ns0:path d="M68 66l17 17 M73 45a27 27 0 1 1-54 0 27 27 0 0 1 54 0z M37 45h18 M46 36v18" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#db9875" stroke="#db9875" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><text x="1010" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Formula medidas de</text><text x="1010" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">gobernanza</text><path d="M1010 432V465Q1010 480 995 480H614Q600 480 600 495V509" fill="none" stroke="#235c83" stroke-width="3" marker-end="url(#flecha)"/><path d="M160 510H1014Q1044 510 1044 540V651Q1044 681 1014 681H160Q130 681 130 651V540Q130 510 160 510Z" fill="#e6f0f8"/><path d="M165 541H205L225 561V642H165ZM205 541V561H225M177 580H212M177 593H212M177 606H203" fill="white" stroke="#235c83" stroke-width="3" stroke-linejoin="round"/><text x="254" y="546" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#235c83" text-anchor="start">PRODUCTO DEL TRABAJO PRÁCTICO</text><text x="254" y="585" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="start">Escenarios, auditoría ética y contro