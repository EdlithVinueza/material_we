<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo practico experimental. Generación de reportes y tableros de mando asistidos por IA</title><desc id="descripcion">Construcción en hoja de cálculo de un tablero de mando comercial con 4 indicadores esenciales conectados a los datos depurados y redacción de un informe ejecutivo de ventas con narrativa interpretativa asistida por inteligencia artificial y validada manualmente. El procedimiento detallado consta en la Práctica 3 de la Guía de Prácticas y se entrega al cierre de la semana 6. Resumen visual: Vincula 4 KPI a los datos depurados; Redacta la narrativa con apoyo de IA; Verifica manualmente cifras e interpretación. Evidencia: Tablero e informe ejecutivo.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#235c83" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e6f0f8"/><circle cx="114" cy="86" r="23" fill="#235c83"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747" /><ns0:rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff" /><ns0:rect x="24" y="43" width="152" height="15" rx="9" fill="#e1f0f3" /><ns0:circle cx="33" cy="50" r="2" fill="#1d6c78" /><ns0:circle cx="41" cy="50" r="2" fill="#1d6c78" /><ns0:circle cx="49" cy="50" r="2" fill="#1d6c78" /><ns0:rect x="35" y="67" width="93" height="64" rx="7" fill="#e1f0f3" /><ns0:g transform="translate(51.5 69.5) scale(0.59)"><ns0:path d="M13 19h74v62H13z M13 32h74 M24 42h23v25H24z M55 67V46 M55 67h21 M58 62l6-8 5 3 6-10" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:rect x="138" y="71" width="23" height="8" rx="4" fill="#db9875" /><ns0:rect x="137" y="86" width="25" height="5" rx="2" fill="#1c3747" /><ns0:rect x="137" y="98" width="23" height="5" rx="2" fill="#1d6c78" /><ns0:path d="M18 151h164l17 13v8H1v-8z" fill="#e1f0f3" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><text x="190" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Vincula 4 KPI a los</text><text x="190" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">datos depurados</text><circle cx="600" cy="165" r="92" fill="#e6f0f8"/><circle cx="524" cy="86" r="23" fill="#235c83"/><text x="524" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(526 91) scale(0.74)"><ns0:rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747" /><ns0:rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff" /><ns0:rect x="24" y="43" width="152" height="15" rx="9" fill="#e1f0f3" /><ns0:circle cx="33" cy="50" r="2" fill="#1d6c78" /><ns0:circle cx="41" cy="50" r="2" fill="#1d6c78" /><ns0:circle cx="49" cy="50" r="2" fill="#1d6c78" /><ns0:rect x="35" y="67" width="93" height="64" rx="7" fill="#e1f0f3" /><ns0:g transform="translate(51.5 69.5) scale(0.59)"><ns0:path d="M18 20v59h67 M29 69V51h12v18 M48 69V39h12v30 M67 69V25h12v44" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:rect x="138" y="71" width="23" height="8" rx="4" fill="#db9875