<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Una alerta de stock apoya una decisión</title><desc id="descripcion">Señal. El nivel de existencias baja del umbral previsto. Comprobación. Verifica reservas, pedidos abiertos y fecha del dato. Decisión. La persona responsable decide si repone stock. Registra qué señales y reglas sustentaron la recomendación.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#e1f0f3" stroke="#e1f0f3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="245" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 162.5) scale(0.825)"><path d="M29 79L100 49l71 30-71 34z" fill="#fbeadb" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M29 79v65l71 32v-63z" fill="#e1f0f3" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M171 79v65l-71 32v-63z" fill="#db9875" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M67 64l70 34v29" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(42.5 98.5) scale(0.45)"><path d="M14 34l36-18 36 18-36 18z M14 34v35l36 17 36-17V34 M50 52v34 M32 25l35 17" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="220" y="389" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Señal</text><text x="220" y="429" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">El nivel de existencias</text><text x="220" y="460" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">baja del umbral</text><text x="220" y="491" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">previsto.</text><ellipse cx="600" cy="298" rx="115" ry="103" fill="#fbeadb"/><g transform="translate(517.5 215.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e1f0f3" stroke="#1d6c78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M68 66l17 17 M73 45a27 27 0 1 1-54 0 27 27 0 0 1 54 0z M37 45h18 M46 36v18" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#db9875" stroke="#db9875" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="600" y="442" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Comprobación</text><text x="600" y="482" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Verifica reservas,</text><text x="600" y="513" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">pedidos abiertos y</text><text x="600" y="544" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">fecha del dato.</text><ellipse cx="980" cy="245" rx="115" ry="103" fill="#ffffff"/><g transform="translate(897.5 162.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e1f0f3" stroke="#1d6c78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M65 31a15 15 0 1 1-30 0 15 15 0 0 1 30 0z M20 82v-8c0-16 14-25 30-25s30 9 30 25v8z" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin