<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Qué puede hacer la IA en una tienda</title><desc id="descripcion">Generar. Preparar un borrador de respuesta comercial. Analizar. Resumir patrones de ventas a partir de registros. Asistir. Proponer una revisión cuando el inventario baja. El problema comercial orienta la elección del asistente.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#e1f0f3" stroke="#e1f0f3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="297" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 214.5) scale(0.825)"><path d="M64 22h77l28 25v131H64Z" fill="#e1f0f3" stroke="#1d6c78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M41 17h77l28 25v128H41Z" fill="#ffffff" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 17v25h28Z" fill="#fbeadb" stroke="#1c3747" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="57" width="73" height="61" rx="12" fill="#e1f0f3"/><g transform="translate(65.0 61.0) scale(0.54)"><path d="M52 21H23v61h54V53 M39 60l4-15 29-29 12 12-29 29z M64 24l12 12 M32 70h16" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="57" y="130" width="70" height="5" rx="2" fill="#1c3747"/><rect x="57" y="142" width="49" height="5" rx="2" fill="#1d6c78"/></g><text x="220" y="441" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Generar</text><text x="220" y="481" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Preparar un borrador</text><text x="220" y="512" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">de respuesta comercial.</text><ellipse cx="600" cy="239" rx="115" ry="103" fill="#fbeadb"/><g transform="translate(517.5 156.5) scale(0.825)"><rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747"/><rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff"/><rect x="24" y="43" width="152" height="15" rx="9" fill="#e1f0f3"/><circle cx="33" cy="50" r="2" fill="#1d6c78"/><circle cx="41" cy="50" r="2" fill="#1d6c78"/><circle cx="49" cy="50" r="2" fill="#1d6c78"/><rect x="35" y="67" width="93" height="64" rx="7" fill="#e1f0f3"/><g transform="translate(51.5 69.5) scale(0.59)"><path d="M18 20v59h67 M29 69V51h12v18 M48 69V39h12v30 M67 69V25h12v44" fill="none" stroke="#1d6c78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="138" y="71" width="23" height="8" rx="4" fill="#db9875"/><rect x="137" y="86" width="25" height="5" rx="2" fill="#1c3747"/><rect x="137" y="98" width="23" height="5" rx="2" fill="#1d6c78"/><path d="M18 151h164l17 13v8H1v-8z" fill="#e1f0f3" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="600" y="383" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Analizar</text><text x="600" y="423" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Resumir patrones de</text><text x="600" y="454" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">ventas a partir de</text><text x="600" y="485" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">registros.</text><ellipse cx="980" cy="297" rx="115" ry="103" fill="#ffffff"/><g transform="translate(897.5 214.5) scale(0.825)"><rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747"/><rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff"/><rect x="24" y="43" width="152" height="15" rx="9" fill="#e1f0f3"