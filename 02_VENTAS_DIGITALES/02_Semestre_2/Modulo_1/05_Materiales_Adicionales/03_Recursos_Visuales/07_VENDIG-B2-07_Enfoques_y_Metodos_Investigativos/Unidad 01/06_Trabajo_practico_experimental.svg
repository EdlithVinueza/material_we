<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo practico experimental. Fundamentos y enfoques de la investigación aplicada</title><desc id="descripcion">Desarrollo de un taller aplicado sobre una tienda en línea ficticia para delimitar su problema de ventas y construir una matriz de selección de enfoque metodológico acorde al objetivo comercial. Los pasos detallados figuran en la Práctica 1 de la Guía de Prácticas y se entregan como producto único al cierre de la semana 2. Resumen visual: Analiza el caso de una tienda digital; Formula pregunta y objetivo comercial; Compara enfoques y justifica el elegido. Evidencia: Ficha técnica y matriz de selección metodológica.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#235c83" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e6f0f8"/><circle cx="114" cy="86" r="23" fill="#235c83"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747" /><ns0:rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff" /><ns0:rect x="24" y="43" width="152" height="15" rx="9" fill="#e0ebfa" /><ns0:circle cx="33" cy="50" r="2" fill="#275892" /><ns0:circle cx="41" cy="50" r="2" fill="#275892" /><ns0:circle cx="49" cy="50" r="2" fill="#275892" /><ns0:rect x="35" y="67" width="93" height="64" rx="7" fi