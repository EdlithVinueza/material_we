<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo practico experimental. Técnicas e instrumentos de recolección de datos</title><desc id="descripcion">Diseño en formularios digitales (de Google o Microsoft) de un cuestionario de 10 preguntas con consentimiento informado, acompañado de una prueba piloto aplicada a 5 usuarios y el registro colaborativo de mejoras al instrumento. El procedimiento detallado figura en la Práctica 2 de la Guía de Prácticas y se entrega al cierre de la semana 4. Resumen visual: Redacta 10 preguntas con consentimiento; Aplica un piloto a 5 usuarios; Registra mejoras detectadas. Evidencia: Formulario y bitácora de ajuste.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#235c83" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e6f0f8"/><circle cx="114" cy="86" r="23" fill="#235c83"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:rect x="16" y="35" width="168" height="115" rx="14" fill="#1c3747" /><ns0:rect x="23" y="42" width="154" height="100" rx="10" fill="#ffffff" /><ns0:rect x="24" y="43" width="152" height="15" rx="9" fill="#e0ebfa" /><ns0:circle cx="33" cy="50" r="2" fill="#275892" /><ns0:circle cx="41" cy="50" r="2" fill="#275892" /><ns0:circle cx="49" cy="50" r="2" fill="#275892" /><ns0:rect x="35" y="67" width="93" height="64" rx="7" fill="#e0ebfa" /><ns0:g transform="translate(51.5 69.5) scale(0.59)"><ns0:path d="M12 21h76v57H12z M12 34h76 M20 27h2 M27 27h2 M34 27h2 M24 45h22v21H24z M54 48h23 M54 59h17" fill="none" stroke="#275892" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:rect x="138" y="71" width="23" height="8" rx="4" fill="#de946d" /><ns0:rect x="137" y="86" width="25" height="5" rx="2" fill="#1c3747" /><ns0:rect x="137" y="98" width="23" height="5" rx="2" fill="#275892" /><ns0:path d="M18 151h164l17 13v8H1v-8z" fill="#e0ebfa" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><text x="190" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Redacta 10</text><text x="190" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">preguntas con</text><text x="190" y="364" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">consentimiento</text><circle cx="600" cy="165" r="92" fill="#e6f0f8"/><circle cx="524" cy="86" r="23" fill="#235c83"/><text x="524" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(526 91) scale(0.74)"><ns0:path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e0ebfa" stroke="#275892" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff" /><ns0:g transform="translate(53.0 52.0) scale(0.96)"><ns0:path d="M50 14l30 12v22c0 17-14 29-30 38-16-9-30-21-30-38V26z M37 48l9 9 18-19" fill="none" stroke="#275892" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#de946d" stroke="#de946d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><text x="600" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Aplica un piloto a 5</text><text x="600" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">usuarios</text><circle cx="1010" cy="165" r="92" fill="#e6f0f8"/><circle cx="934" cy="86" r="23" fill="#235c83"/><text x="934" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(936 91) scale(0.74)"><ns0:path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#e0ebfa" stroke="#275892" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff" /><ns0:g transform="translate(53.0 52.0) scale(0.96)"><ns0:path d="M83 46v4a33 33 0 1 1-16-28 M34 49l13 13 33-34" fill="none" stroke="#275892" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#de946d" stroke="#de946d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><text x="1010" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Registra mejoras</text><text x="1010" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">detectadas</text><path d="M1010 432V465Q1010 480 995 480H614Q600 480 600 495V509" fill="none" stroke="#235c83" stroke-width="3" marker-end="url(#flecha)"/><path d="M160 510H1014Q1044 510 1044 540V651Q1044 681 1014 681H160Q130 681 130 651V540Q130 510 160 510Z" fill="#e6f0f8"/><path d="M165 541H205L225 561V642H165ZM205 541V561H225M177 580H212M177 593H212M177 606H203" fill="white" stroke="#235c83" stroke-width="3" stroke-linejoin="round"/><text x="254" y="546" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#235c83" text-