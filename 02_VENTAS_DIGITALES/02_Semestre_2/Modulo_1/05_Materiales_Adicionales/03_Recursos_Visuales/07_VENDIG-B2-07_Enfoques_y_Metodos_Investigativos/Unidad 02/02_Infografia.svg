<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Tres formas de recoger evidencia</title><desc id="descripcion">Encuesta. Compara respuestas estructuradas con un cuestionario. Entrevista. Profundiza en experiencias con una guía de preguntas. Observación. Registra interacciones con una ficha y un criterio común. La pregunta de investigación orienta qué técnica usar.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#e0ebfa" stroke="#e0ebfa" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="297" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 214.5) scale(0.825)"><path d="M64 22h77l28 25v131H64Z" fill="#e0ebfa" stroke="#275892" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M41 17h77l28 25v128H41Z" fill="#ffffff" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 17v25h28Z" fill="#fcebdd" stroke="#1c3747" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="57" width="73" height="61" rx="12" fill="#e0ebfa"/><g transform="translate(65.0 61.0) scale(0.54)"><path d="M27 12h35l15 15v61H27z M62 12v16h15 M38 46h28 M38 57h28 M38 68h19" fill="none" stroke="#275892" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="57" y="130" width="70" height="5" rx="2" fill="#1c3747"/><rect x="57" y="142" width="49" height="5" rx="2" fill="#275892"/></g><text x="220" y="441" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Encuesta</text><text x="220" y="481" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">Compara respuestas</text><text x="220" y="512" fill="#364e5a" font-size="27" font-family="DejaV