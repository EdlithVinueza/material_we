<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo autonomo. Fundamentos y técnicas de prospección digital</title><desc id="descripcion">Durante la semana 1, lectura comprensiva de HubSpot (2024, páginas 5 a 15) para elaborar un resumen estructurado sobre tendencias actuales de prospección comercial; durante la semana 2, resolución de un cuestionario en línea sobre metodologías y criterios de prospección, consolidando sus evidencias en una entrega única en Moodle al cierre de la semana 2. Resumen visual: Lee sobre tendencias de prospección; Redacta un resumen estructurado; Resuelve el cuestionario de métodos. Evidencia: Resumen y cuestionario en un único envío.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#21685e" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#21685e" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e5f2ed"/><circle cx="114" cy="86" r="23" fill="#21685e"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:path d="M64 22h77l28 25v131H64Z" fill="#efe3f2" stroke="#6c4977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M41 17h77l28 25v128H41Z" fill="#ffffff" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M118 17v25h28Z" fill="#f9ead2" stroke="#1c3747" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:rect x="56" y="57" width="73" he