<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Trabajo practico experimental. Análisis básico de mercado y perfil de cliente ideal</title><desc id="descripcion">Diseño de la ficha técnica completa del comprador representativo (buyer persona) para un negocio digital —integrando perfil organizacional ideal, puntos de dolor, motivadores, objeciones, mensajes personalizados y flujo de traspaso al sistema de gestión de relaciones con clientes—, culminando con la presentación del proyecto integrador de prospección y cartera de clientes potenciales. El procedimiento detallado figura en la Práctica 4 de la Guía de Prácticas y se entrega al cierre de la semana 8. Resumen visual: Define el perfil ideal y el comprador; Vincula motivadores, objeciones y mensajes; Organiza el traspaso de prospectos al CRM. Evidencia: Ficha completa y proyecto de prospección.. Diagrama de tres pasos y producto integrado; los requisitos completos permanecen en la ficha.</desc><defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#235c83" stroke-width="2"/></marker></defs><path d="M300 165H485" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><path d="M710 165H895" fill="none" stroke="#235c83" stroke-width="4" marker-end="url(#flecha)"/><circle cx="190" cy="165" r="92" fill="#e6f0f8"/><circle cx="114" cy="86" r="23" fill="#235c83"/><text x="114" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(116 91) scale(0.74)"><ns0:path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#efe3f2" stroke="#6c4977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ns0:ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff" /><ns0:g transform="translate(53.0 52.0) scale(0.96)"><ns0:path d="M65 31a15 15 0 1 1-30 0 15 15 0 0 1 30 0z M20 82v-8c0-16 14-25 30-25s30 9 30 25v8z" fill="none" stroke="#6c4977" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#dca46c" stroke="#dca46c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><text x="190" y="294" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">Define el perfil ideal</text><text x="190" y="329" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">y el comprador</text><circle cx="600" cy="165" r="92" fill="#e6f0f8"/><circle cx="524" cy="86" r="23" fill="#235c83"/><text x="524" y="94" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(526 91) scale(0.74)"><ns0:rect x="35" y="66" width="132" height="106" rx="7" fill="#ffffff" stroke="#1c3747" stroke-width="2" /><ns0:rect x="58" y="102" width="45" height="53" rx="3" fill="#efe3f2" stroke="#6c4977" stroke-width="2" /><ns0:rect x="116" y="102" width="31" height="70" rx="3" fill="#f9ead2" stroke="#1c3747" stroke-width="2" /><ns0:path d="M27 70l22-39h105l22 39v14H27Z" fill="#dca46c" stroke="#1c3747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M58 34l-12 36v12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M86 34l-4 36v12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M114 34l4 36v12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M142 34l12 36v12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ns0:g transform="translate(5