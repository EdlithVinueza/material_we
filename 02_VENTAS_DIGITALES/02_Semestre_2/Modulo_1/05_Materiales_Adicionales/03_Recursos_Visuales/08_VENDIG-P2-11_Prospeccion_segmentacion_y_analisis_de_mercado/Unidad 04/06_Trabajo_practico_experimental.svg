<text x="1010" y="364" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="middle">CRM</text><path d="M1010 432V465Q1010 480 995 480H614Q600 480 600 495V509" fill="none" stroke="#235c83" stroke-width="3" marker-end="url(#flecha)"/><path d="M160 510H1014Q1044 510 1044 540V651Q1044 681 1014 681H160Q130 681 130 651V540Q130 510 160 510Z" fill="#e6f0f8"/><path d="M165 541H205L225 561V642H165ZM205 541V561H225M177 580H212M177 593H212M177 606H203" fill="white" stroke="#235c83" stroke-width="3" stroke-linejoin="round"/><text x="254" y="546" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#235c83" text-anchor="start">PRODUCTO DEL TRABAJO PRÁCTICO</text><text x="254" y="585" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#183344" text-anchor="start">Ficha completa y proyecto de prospección</text></svg>