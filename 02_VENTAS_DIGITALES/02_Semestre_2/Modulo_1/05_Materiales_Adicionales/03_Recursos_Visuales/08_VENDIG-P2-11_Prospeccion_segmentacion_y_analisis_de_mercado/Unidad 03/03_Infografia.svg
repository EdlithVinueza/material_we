<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Las palabras revelan distintas búsquedas</title><desc id="descripcion">Explorar. «Cómo elegir una talla» expresa una necesidad de información. Comparar. «Tallas y precios» ayuda a reconocer evaluación de opciones. Comprar. «Comprar con retiro hoy» sugiere una acción más próxima. Usa el vocabulario real y verifica el encaje.</desc><path d="M45 324Q98 177 291 179q95 13 199 12 140-86 255-37 136 66 259 44 95-13 140 116 76 216-24 273-113 47-264 35-147 18-308 0-158 22-318-9Q34 607 45 324Z" fill="#efe3f2" stroke="#efe3f2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="245" rx="115" ry="103" fill="#ffffff"/><g transform="translate(137.5 162.5) scale(0.825)"><path d="M30 62Q50 29 94 29q57 0 75 42 26 61-29 91-56 29-98-12-32-31-12-88z" fill="#efe3f2" stroke="#6c4977" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="103" cy="101" rx="64" ry="60" fill="#ffffff"/><g transform="translate(53.0 52.0) scale(0.96)"><path d="M68 66l17 17 M73 45a27 27 0 1 1-54 0 27 27 0 0 1 54 0z M37 45h18 M46 36v18" fill="none" stroke="#6c4977" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M161 35q3 8 12 12q-9 3-12 12q-3-9-12-12q9-3 12-12z" fill="#dca46c" stroke="#dca46c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220" y="389" fill="#172d40" font-size="32" font-family="DejaVu Sans" font-weight="700" text-anchor="middle">Explorar</text><text x="220" y="429" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">«Cómo elegir una talla»</text><text x="220" y="460" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle">expresa una necesidad</text><text x="220" y="491" fill="#364e5a" font-size="27" font-family="DejaVu Sans" font-weight="400" 